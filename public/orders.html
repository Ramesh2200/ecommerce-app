<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - AuraCraft</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon">⚡</div>
      <div class="brand-text">Aura<span>Craft</span></div>
    </a>

    <div class="nav-actions">
      <select class="currency-select sort-select" style="padding: 0.45rem 0.7rem; font-size: 0.85rem; font-weight: 600; cursor: pointer;">
        <option value="USD">🇺🇸 USD ($)</option>
        <option value="INR">🇮🇳 INR (₹)</option>
      </select>
      <a href="index.html" class="nav-btn">← <span>Back to Shop</span></a>
      
      <button id="cartNavBtn" class="nav-btn">
        🛒 <span>Cart</span>
        <span class="cart-badge" style="display: none;">0</span>
      </button>

      <button id="authNavBtn" class="nav-btn" style="background: var(--gradient-accent); border: none; color: #fff;">
        👤 <span>Sign In</span>
      </button>

      <div id="userMenuContainer" class="user-menu-container" style="display: none;">
        <button id="userAvatarBtn" class="nav-btn">👤 <span>Account</span></button>
        <div id="userDropdown" class="user-dropdown">
          <div class="user-dropdown-header">
            <div id="userDropdownName" class="user-dropdown-name">User Name</div>
            <div id="userDropdownEmail" class="user-dropdown-email">user@example.com</div>
          </div>
          <a href="orders.html" class="dropdown-item">📦 My Orders</a>
          <a href="#" id="logoutBtn" class="dropdown-item" style="color: var(--danger);">🚪 Log Out</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-container" style="padding-top: 2rem; max-width: 900px; margin: 0 auto;">
    <h1 style="font-family: var(--font-heading); font-size: 2.2rem; font-weight: 800; margin-bottom: 2rem;">Order History & Tracking</h1>

    <div id="ordersContainer">
      <!-- Injected dynamically via orders.js -->
    </div>
  </main>

  <!-- Slide-Over Cart Drawer -->
  <div id="cartDrawerOverlay" class="cart-drawer-overlay"></div>
  <aside id="cartDrawer" class="cart-drawer">
    <div class="cart-header">
      <h3 class="cart-title">Your Cart</h3>
      <button id="closeCartDrawerBtn" class="close-btn">✕</button>
    </div>
    <div id="cartDrawerBody" class="cart-body"></div>
    <div class="cart-footer">
      <div class="cart-summary-row total">
        <span>Subtotal:</span>
        <span id="cartSubtotal">$0.00</span>
      </div>
      <a href="checkout.html" id="cartCheckoutBtn" class="btn-primary" style="text-align: center; justify-content: center;">
        Proceed to Checkout →
      </a>
    </div>
  </aside>

  <!-- Auth Modal -->
  <div id="authModal" class="modal-overlay">
    <div class="modal-card">
      <button id="closeAuthModalBtn" style="position: absolute; right: 1.2rem; top: 1.2rem; font-size: 1.2rem; color: var(--text-muted);">✕</button>
      <h2 id="modalTitle" style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 700; margin-bottom: 1.5rem;">Sign In</h2>
      <form id="authForm">
        <div id="nameGroup" class="form-group" style="display: none;">
          <label class="form-label">Full Name</label>
          <input type="text" id="authName" class="form-input" placeholder="Alex Mercer" />
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="authEmail" class="form-input" required placeholder="alex@example.com" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="authPassword" class="form-input" required placeholder="••••••••" />
        </div>
        <button type="submit" id="authSubmitBtn" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">Sign In</button>
      </form>
      <div id="authSwitchText" style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
        Don't have an account? <a href="#" id="switchAuthMode" style="color: var(--primary); font-weight: 600;">Sign up</a>
      </div>
    </div>
  </div>

  <script src="js/currency.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
